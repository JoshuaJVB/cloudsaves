name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: client/go.sum

      - name: Add MinGW64 to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Generate icon
        working-directory: client
        run: go run gen_icon.go

      - name: Build exe
        working-directory: client
        run: fyne package -os windows -name "CloudSave"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Get version
        id: version
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          echo "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        working-directory: client
        run: iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CloudSave ${{ github.ref_name }}
          generate_release_notes: true
          files: client/CloudSave-Setup.exe

  linux:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: client/go.sum

      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Build Linux binary
        working-directory: client
        run: go build -o cloudsave-linux-amd64 .

      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: client/cloudsave-linux-amd64
